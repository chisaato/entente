# Entente 用的最小 Envoy bootstrap。
#
# 分工:
#   - Listener(端口、TLS、filter chain)是静态的,写在这里。Entente
#     从不创建或修改 listener;不使用 LDS。
#   - 业务 filter chain 的 HttpConnectionManager 通过 RDS,按
#     route_config_name 拉取路由。这个名字就是 Entente 配置里声明、
#     容器 label 所引用的 "entrypoint"。
#   - cluster 和 endpoint 由 Entente 经 CDS/EDS 下发。
#   - 真证书由 Entente 从 OpenBao 读取,经 SDS 下发;兜底证书和路由完全静态。
#   - 所有动态资源走同一条 ADS 流,连到 Entente 的 Unix socket。

node:
  # 必须与 Entente 配置里的 node_id 相同。
  id: envoy
  cluster: entente-demo

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

dynamic_resources:
  ads_config:
    api_type: GRPC
    transport_api_version: V3
    set_node_on_first_message_only: true
    grpc_services:
      - envoy_grpc: { cluster_name: entente_xds }
  cds_config:
    resource_api_version: V3
    ads: {}
  # 没有 lds_config:listener 是静态的。

static_resources:
  # 兜底证书是静态 secret,不依赖 Entente 或 OpenBao。
  # 生产可用 entente gen-cert --name sink 输出的内联 YAML 替换此项。
  secrets:
    - name: sink
      tls_certificate:
        certificate_chain: { filename: /etc/envoy/sink/tls.crt }
        private_key: { filename: /etc/envoy/sink/tls.key }
  clusters:
    - name: entente_xds
      type: STATIC
      connect_timeout: 1s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            # gRPC 需要 HTTP/2。
            http2_protocol_options: {}
      load_assignment:
        cluster_name: entente_xds
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    pipe: { path: /run/entente/xds.sock }

  listeners:
    - name: http
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: http
                upgrade_configs: [{upgrade_type: websocket}]
                # 把 "Host: app.example.com:8080" 按域名 "app.example.com" 匹配。
                strip_any_host_port: true
                rds:
                  # entrypoint 名。
                  route_config_name: http
                  config_source:
                    resource_api_version: V3
                    ads: {}
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    - name: https
      address:
        socket_address: { address: 0.0.0.0, port_value: 8443 }
      listener_filters:
        - name: envoy.filters.listener.tls_inspector
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
      filter_chains:
        - filter_chain_match:
            # 精确匹配示例域名,不让未知 SNI 取得真实证书。
            server_names: [whoami.example.com, legacy.example.com]
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                # 真证书按名字订阅,与路由共用 ADS,不挂载真证书文件。
                tls_certificate_sds_secret_configs:
                  - name: demo-cert
                    sds_config:
                      resource_api_version: V3
                      ads: {}
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: https
                upgrade_configs: [{upgrade_type: websocket}]
                strip_any_host_port: true
                rds:
                  # entrypoint 名。
                  route_config_name: https
                  config_source:
                    resource_api_version: V3
                    ads: {}
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      # 不匹配或没有 SNI 时,使用独立于动态配置的证书和路由。
      default_filter_chain:
        transport_socket:
          name: envoy.transport_sockets.tls
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
            common_tls_context:
              tls_certificate_sds_secret_configs:
                - name: sink
        filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: sink
              route_config:
                name: sink
                virtual_hosts:
                  - name: sink
                    domains: ["*"]
                    routes:
                      - match: { prefix: "/" }
                        direct_response:
                          status: 421
                          body: { inline_string: "Misdirected Request\n" }
              http_filters:
                - name: envoy.filters.http.router
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
