# Minimal Envoy bootstrap for Entente.
#
# Division of labour:
#   - Listeners (ports, TLS, filter chains) are static and live here. Entente
#     never creates or changes listeners; LDS is not used.
#   - Each listener's HttpConnectionManager fetches its routes over RDS by
#     route_config_name. That name is the "entrypoint" Entente's config
#     declares and container labels reference.
#   - Clusters and endpoints come from Entente over CDS/EDS.
#   - Everything dynamic travels on one ADS stream to Entente's Unix socket.

node:
  # Must equal node_id in the Entente config.
  id: envoy
  cluster: entente-demo

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

dynamic_resources:
  ads_config:
    api_type: GRPC
    transport_api_version: V3
    set_node_on_first_message_only: true
    grpc_services:
      - envoy_grpc: { cluster_name: entente_xds }
  cds_config:
    resource_api_version: V3
    ads: {}
  # No lds_config: listeners are static.

static_resources:
  clusters:
    - name: entente_xds
      type: STATIC
      connect_timeout: 1s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}   # gRPC needs HTTP/2
      load_assignment:
        cluster_name: entente_xds
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    pipe: { path: /run/entente/xds.sock }

  listeners:
    - name: http
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: http
                # Match "Host: app.example.com:8080" against domain "app.example.com".
                strip_any_host_port: true
                rds:
                  route_config_name: http        # entrypoint name
                  config_source:
                    resource_api_version: V3
                    ads: {}
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    - name: https
      address:
        socket_address: { address: 0.0.0.0, port_value: 8443 }
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                # File-based certificates. SDS is a later phase.
                tls_certificates:
                  - certificate_chain: { filename: /etc/envoy/certs/tls.crt }
                    private_key: { filename: /etc/envoy/certs/tls.key }
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: https
                strip_any_host_port: true
                rds:
                  route_config_name: https       # entrypoint name
                  config_source:
                    resource_api_version: V3
                    ads: {}
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
